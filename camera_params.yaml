# ============================================================================
# このファイルは何をするものか
# ----------------------------------------------------------------------------
# Kinect v2 カメラのパラメータ（内部パラメータ・外部パラメータ・座標軸の向き）を
# まとめた設定ファイルです。
# ステップ2「深度アライメント」とステップ5「3D位置推定」がこの値を読み込みます。
#
# 【重要】KFuji RGB-DS データセットにはキャリブレーション結果が同梱されていません。
#   そのため、ここに書いてある値は Kinect v2 の一般的な公称値（工場出荷値）です。
#   より正確に合わせたい場合は src/verify_alignment.py を実行して
#   投影結果を目で確認し、必要ならこのファイルの数値を書き換えてください。
# ============================================================================

# --- カラーカメラ（RGB画像を撮る側）の情報 ---
color_camera:
  # カラー画像の横幅（ピクセル）。生データの *_RGB.jpg は 1920x1080 です
  image_width: 1920
  # カラー画像の縦幅（ピクセル）
  image_height: 1080
  # 焦点距離（横方向、ピクセル単位）。Kinect v2 カラーカメラの公称値
  fx: 1081.3720
  # 焦点距離（縦方向、ピクセル単位）
  fy: 1081.3720
  # 画像中心の横座標（主点、ピクセル単位）
  cx: 959.5
  # 画像中心の縦座標（主点、ピクセル単位）
  cy: 539.5

# --- 点群データ（*_pc.mat の中の ptCloud 変数）の列の並び ---
point_cloud_columns:
  # 0列目が X 座標（メートル）
  x: 0
  # 1列目が Y 座標（メートル）
  y: 1
  # 2列目が Z 座標（メートル）
  z: 2
  # 3列目が 赤(R) の値（0〜255）
  red: 3
  # 4列目が 緑(G) の値（0〜255）
  green: 4
  # 5列目が 青(B) の値（0〜255）
  blue: 5
  # 6列目が 近赤外(IR)の生の強度
  infrared: 6
  # 7列目が 距離で補正した近赤外強度（S）
  infrared_range_corrected: 7

# --- 点群の座標軸を、コンピュータビジョンの標準的な向きに直すための行列 ---
# KFuji の点群は「X=右、Y=前（奥行き）、Z=上」という向きで保存されています。
# 一方、カメラへの投影計算では「x=右、y=下、z=前（奥行き）」の向きを使います。
# 下の3x3行列を [X, Y, Z] に掛けると [x_cv, y_cv, z_cv] に変換されます。
#   1行目 [1, 0, 0]  → x_cv =  X （右はそのまま右）
#   2行目 [0, 0,-1]  → y_cv = -Z （上向きZの符号を反転して下向きyにする）
#   3行目 [0, 1, 0]  → z_cv =  Y （前向きYを奥行きzにする）
axis_permutation_matrix:
  - [1, 0, 0]
  - [0, 0, -1]
  - [0, 1, 0]

# --- 外部パラメータ（深度センサ座標系 → カラーカメラ座標系 への移動） ---
# Kinect v2 は深度センサとカラーカメラが物理的に離れた位置に付いているため、
# 点群をそのままカラー画像に投影すると横にずれます。そのずれを直すのがここの値です。
#
# 下の値は src/verify_alignment.py で実際に求めたものです。
# （点群の各点が持っている色と、投影先のカラー画像の色を比べて、
#   一番よく一致する平行移動量を探した結果）
#   ・平行移動なし          … 一致度（相関係数）0.31
#   ・下の平行移動を適用時  … 一致度（相関係数）0.63
# tx = -0.055 m という値は、Kinect v2 の深度センサとカラーカメラの
# 実際の間隔（約52mm）とほぼ一致しており、物理的にも妥当な値です。
#
# 座標系は「x=右, y=下, z=前」です（axis_permutation_matrix で変換した後の向き）。
extrinsics:
  # 回転（度）。X軸まわり・Y軸まわり・Z軸まわりの順。ずれが無ければ全て 0
  rotation_degrees: [0.0, 0.0, 0.0]
  # 平行移動（メートル）。[左右, 上下, 奥行き] の順
  translation_meters: [-0.055, -0.009, 0.0]

# --- 深度アライメント（ステップ2）の動作設定 ---
depth_alignment:
  # 投影後にできる「点と点の隙間」を埋めるかどうか（true で埋める）
  fill_holes: true
  # 隙間を埋めるときの膨張フィルタのサイズ（ピクセル）。大きいほど隙間が埋まるが粗くなる
  fill_kernel_size: 5

# --- 3D位置推定（ステップ5）の動作設定 ---
spatial_localization:
  # 検出枠の中央何割を深度の取得に使うか。0.5 なら枠の中央50%だけを使う。
  # 枠の端は背景（葉や空）が写り込みやすいため、中央だけを使って精度を上げる
  box_shrink_ratio: 0.5
  # 3D座標を計算するのに最低限必要な有効深度ピクセル数。これ未満なら「深度不明」とする
  minimum_valid_pixels: 10

# --- 推論時のタイル分割（ステップ3・4）の設定 ---
# 学習は 548x373 の切り出し画像で行うため、推論も同じ見かけサイズになるよう
# 生画像(1920x1080)を同じ大きさのタイルに分割してから推論します。
tiling:
  # タイル1枚の横幅（データセットの切り出し画像と同じ 548）
  tile_width: 548
  # タイル1枚の縦幅（データセットの切り出し画像と同じ 373）
  tile_height: 373
  # 横方向に何枚並べるか
  columns: 3
  # 縦方向に何枚並べるか
  rows: 3
  # 横方向のタイル間の移動量（ピクセル）。データセットの切り出し方から実測した値
  stride_x: 514
  # 縦方向のタイル間の移動量（ピクセル）。データセットの切り出し方から実測した値
  stride_y: 340
  # タイル全体を配置し始める左上の位置（ピクセル）。
  # 3x3 タイルは 1576x1053 の範囲をカバーし、これを画像の中央に置く
  origin_x: 172
  origin_y: 13
